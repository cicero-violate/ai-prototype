[package]
name = "ai"
version = "0.1.0"
edition = "2021"
default-run = "supervisor"

[lib]
name = "ai"
path = "src/lib.rs"

[[bin]]
name = "ai"
path = "src/main.rs"

[[bin]]
name = "kernel_tlog"
path = "src/bin/kernel_tlog.rs"

[[bin]]
name = "supervisor"
path = "src/bin/supervisor.rs"

[features]
binary-tlog = []

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
ignore = { workspace = true }
nucleo-matcher = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
judgement = { path = "../judgement" }
structural-editor = { path = "../neurosymbolic/structural-editor" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "process"] }
tower = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
