[package]
name = "ai"
version = "0.1.0"
edition = "2021"
default-run = "supervisor"

[lib]
name = "ai"
path = "src/lib.rs"

[[bin]]
name = "ai"
path = "src/main.rs"

[[bin]]
name = "kernel_tlog"
path = "src/bin/kernel_tlog.rs"

[[bin]]
name = "supervisor"
path = "src/bin/supervisor.rs"

[dependencies]
axum = { version = "0.7", features = [] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "process"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
validation = { path = "../validation" }
