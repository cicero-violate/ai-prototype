[workspace]

[package]
name = "graph-editor"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "graph_patch"
path = "src/bin/graph_patch.rs"


[[bin]]
name = "auto_refactor_plan"
path = "src/bin/auto_refactor_plan.rs"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
