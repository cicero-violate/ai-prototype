[workspace]
# canon-rustc-v3 is a sibling directory and cannot be a workspace member
# (Cargo requires members to be subdirectories of the workspace root).
# It is referenced as a path dependency instead — same type sharing, no layout change.

[package]
name = "graph-editor"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "graph_patch"
path = "src/bin/graph_patch.rs"

[dependencies]
# Types shared with the wrapper (graph, facts, flags, emit — no rustc driver).
canon-rustc-v3 = { path = "../canon-rustc-v3", default-features = false }
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
