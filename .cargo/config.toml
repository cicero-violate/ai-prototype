# Root validation must not require a local wrapper binary. Wrapper graph capture is
# explicit and opt-in:
# CANON_RUSTC_WRAPPER=/path/to/canon-rustc-v3 cargo test --all-targets

[build]

rustflags = [
"-Dwarnings",
"-Dunused",
"-Dunused-attributes",
"-Dunused-imports",
"-Dunused-variables",
"-Ddead-code",
"-Dclippy::allow_attributes",
"-Dclippy::allow_attributes_without_reason"
]

[env]
RUST_BACKTRACE = "full"
CANON_RUSTC_V3_ARTIFACT_DIR = "state/rustc"
