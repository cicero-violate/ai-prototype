[build]
rustc-wrapper = "canon-rustc-v3/scripts/canon-rustc-v3"

rustflags = [
"-Dwarnings",
"-Dunused",
"-Dunused-attributes",
"-Dunused-imports",
"-Dunused-variables",
"-Ddead-code",
"-Dclippy::allow_attributes",
"-Dclippy::allow_attributes_without_reason"
]

[target.'cfg(all())']
rustflags = [
  "-Dwarnings",
  "-Ddead-code",
  "-Dclippy::allow_attributes",
  "-Dclippy::allow_attributes_without_reason"
]


[env]
CANON_RUSTC_V3_ARTIFACT_DIR = "state/rustc"
RUST_BACKTRACE = "full"
SUPERVISOR_PORT = "9100"
AI_TLOG_DIR = { value = "tlog", relative = true }
AI_WORKER_BIN = { value = "target/debug/worker", relative = true }
AI_AGENT_BIN = { value = "target/debug/agent", relative = true }
AI_WORKER_PORT = "9100"
CANON_OPENAI_BASE_URL = "http://127.0.0.1:8082/v1"
CANON_OPENAI_MODEL = "chatgpt-cdp"
PROJECT_DIR = { value = ".", relative = true }
MCP_CONNECTOR_URL = "http://127.0.0.1:4000"
AI_MCP_WORKER_URL = "http://127.0.0.1:38469/mcp_worker"
SSE_CHUNKS_DIR = { value = "agent_state/sse-chunks", relative = true }
ROUTER_TURN_MAX_MS = "600000"
ROUTER_FIRST_CAPTURE_MS = "60000"
ROUTER_IDLE_MS = "2500"
