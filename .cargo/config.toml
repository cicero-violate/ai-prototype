# RUSTC_WRAPPER="$PWD/target/debug/canon-rustc-v3" cargo check

[build]
rustflags = [
"-Dwarnings",
"-Dunused",
"-Dunused-attributes",
"-Dunused-imports",
"-Dunused-variables",
"-Ddead-code",
"-Dclippy::allow_attributes",
"-Dclippy::allow_attributes_without_reason"
]

[env]
# Root validation must not depend on a local rustc wrapper. To capture graph
# telemetry explicitly, run with:
#   CANON_RUSTC_WRAPPER=/path/to/canon-rustc-v3 \
#   CANON_RUSTC_V2_ARTIFACT_DIR=state/rustc cargo test --all-targets
RUST_BACKTRACE = "full"
