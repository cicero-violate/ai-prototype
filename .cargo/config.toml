[build]
# rustc-wrapper = "../scripts/rustc-wrapper-auto.sh"

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[target.'cfg(all())']
rustflags = [
  "-Dwarnings",
  "-Dunused",
  "-Dunused-attributes",
  "-Dunused-imports",
  "-Dunused-variables",
  "-Ddead-code",
  "-Dclippy::allow_attributes",
  "-Dclippy::allow_attributes_without_reason",
  "-Dclippy::wildcard_enum_match_arm",
  "-Dclippy::match_wildcard_for_single_variants",
  "-Dclippy::unwrap_used",
  "-C",
  "link-arg=-fuse-ld=mold",
]


[env]
CANON_RUSTC_V3_ARTIFACT_DIR = { value = "/workspace/ai_sandbox/canon-mini-agent/prototype/state/rustc", relative = false }
PROJECT_DIR = { value = "/workspace/ai_sandbox/canon-mini-agent/prototype/", relative = false }
AI_TLOG_DIR = { value = "/workspace/ai_sandbox/canon-mini-agent/prototype/state/tlog", relative = false }
RUST_BACKTRACE = "full"
SUPERVISOR_PORT = "9100"
AI_WORKER_BIN = { value = "../target/debug/worker", relative = true }
AI_KERNEL_TLOG_BIN = { value = "../target/debug/kernel_tlog", relative = true }
AI_AGENT_BIN = { value = "../target/debug/agent", relative = true }
CANON_OPENAI_BASE_URL = "http://127.0.0.1:8082/v1"
CANON_BROWSER_CDP_URL = "http://127.0.0.1:9223"
MCP_CONNECTOR_URL = "http://127.0.0.1:9100"
MCP_WORKSPACE_ROOT = { value = "..", relative = true }
MCP_ALLOWED_WORKSPACE_ROOT = { value = "..", relative = true }
AI_MCP_WORKER_URL = "http://127.0.0.1:38469/mcp_worker"
MCP_WORKER_RESPONSE_TIMEOUT_SECS = "600"
BASE_URL = "https://cheese-server.duckdns.org"
APPLY_PATCH_BIN = "apply_patch"
AI_SUPERVISOR_URL = "http://127.0.0.1:9100"
CANON_OPENAI_MODEL = "chatgpt-project"
SSE_CHUNKS_DIR = { value = "../state/agent_state/sse-chunks", relative = true }
ROUTER_TURN_MAX_MS = "600000"
ROUTER_FIRST_CAPTURE_MS = "60000"
ROUTER_IDLE_MS = "2500"
GROUP_CHAT_LANDMARK_ACTION_ALLOWLIST = "all"
TASK_RUNNER_COUNT = "1"
AGENT_COUNT = "1"
CANON_EXECUTOR_COUNT = "1"
CANON_TASK_CLAIM_CAP = "1"
INVARIANT_MINER_ENABLED = "1"
INVARIANT_AUTO_PROMOTE = "1"
INVARIANT_MINER_INTERVAL_SECS = "120"
INVARIANT_MINER_STARTUP_DELAY_SECS = "10"
INVARIANT_MIN_SUPPORT = "1"